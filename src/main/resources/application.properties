spring.application.name=delivery_app

# PostgreSQL Configuration
# Uses environment variables when deployed; falls back to your local
# Postgres for everyday development in IntelliJ.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:mummy}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# Allowed frontend origin(s) for CORS, comma-separated.
# Locally this defaults to your React dev server; in production, set the
# ALLOWED_ORIGINS environment variable to your deployed frontend URL.
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}